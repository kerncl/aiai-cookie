name: Build, test and deploy to Azure Container Apps

on:
  push:
    branches: [main]
    # Docs-only changes shouldn't rebuild a 153 MB image.
    paths-ignore:
      - '**.md'
      - 'terraform/**'
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-aiai-cookie
  AZURE_CONTAINER_APP: aiai-cookie

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase paths, and org/repo names often have capitals.
      - name: Resolve lowercase image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Validate the catalogue parses
        run: |
          python -c "
          import json
          c = json.load(open('data/cookies.json'))
          json.load(open('data/ui.json'))
          slugs = [x['slug'] for x in c['cookies']]
          assert len(slugs) == len(set(slugs)), 'duplicate slug'
          for x in c['cookies']:
              for a in x['allergens']:
                  assert a in c['allergen_labels'], f\"unknown allergen {a} on {x['slug']}\"
              for d in x.get('dietary', []):
                  assert d in c['dietary_labels'], f\"unknown dietary tag {d} on {x['slug']}\"
          print(len(slugs), 'cookies OK')
          "

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aiai-cookie:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catch a broken page before it ever reaches Azure.
      - name: Smoke-test the container
        run: |
          docker run -d --name ci -p 5000:8000 aiai-cookie:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/healthz > /dev/null && break
            sleep 2
          done
          python scripts/smoke.py
          docker rm -f ci

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha

  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest

    # id-token: write is REQUIRED for OIDC. Without it azure/login fails with
    # "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL" — the single most common
    # mistake when setting this up.
    permissions:
      id-token: write
      contents: read

    steps:
      # No password anywhere. GitHub presents a short-lived token proving this
      # workflow is kerncl/aiai-cookie on main; Azure validates it against the
      # federated credential and issues an access token valid for minutes.
      - name: Sign in to Azure (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploying by commit SHA, not :latest — so the running revision is always
      # traceable to exact source, and rollback is just redeploying an older SHA.
      - name: Deploy new image
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ needs.build-test-push.outputs.image }}:${{ github.sha }}" \
            --output none
          echo "Deployed ${{ github.sha }}"

      - name: Verify the live site
        run: |
          FQDN=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://$FQDN"

          # min-replicas is 0, so this may be a cold start. Allow for it.
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "https://$FQDN/healthz" || true)
            [ "$code" = "200" ] && { echo "Live: https://$FQDN"; exit 0; }
            echo "  attempt $i -> $code, retrying..."
            sleep 10
          done
          echo "Site did not return 200 after deploy"
          exit 1
